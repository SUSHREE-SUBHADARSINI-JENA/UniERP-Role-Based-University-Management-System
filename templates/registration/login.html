<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - UniERP</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 antialiased min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100">
        
        <!-- Header -->
        <div class="bg-indigo-600 px-8 py-6 text-center">
            <a href="{% url 'home' %}" class="inline-block mb-3">
                <div class="flex items-center justify-center text-white">
                    <i class="fa-solid fa-graduation-cap text-3xl mr-2"></i>
                    <span class="font-bold text-2xl">Uni<span class="text-indigo-200">ERP</span></span>
                </div>
            </a>
            <h2 class="text-white text-lg font-medium opacity-90">Sign in to your account</h2>
        </div>

        <!-- Form -->
        <div class="p-8">
            {% if form.errors %}
                <div class="bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-lg mb-6 flex items-start">
                    <i class="fa-solid fa-circle-exclamation mt-1 mr-3"></i>
                    <p class="text-sm font-medium">Your username and password didn't match. Please try again.</p>
                </div>
            {% endif %}

            <form method="post" action="{% url 'login' %}" class="space-y-6">
                {% csrf_token %}
                
                <div class="space-y-2">
                    <label for="{{ form.username.id_for_label }}" class="text-sm font-semibold text-slate-700 block">Username</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa-solid fa-user text-slate-400"></i>
                        </div>
                        <input type="text" name="{{ form.username.name }}" id="{{ form.username.id_for_label }}" required autofocus
                            class="block w-full pl-10 pr-3 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-600 focus:border-indigo-600 sm:text-sm transition placeholder-slate-400"
                            placeholder="Enter your username">
                    </div>
                </div>

                <div class="space-y-2">
                    <label for="{{ form.password.id_for_label }}" class="text-sm font-semibold text-slate-700 block">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa-solid fa-lock text-slate-400"></i>
                        </div>
                        <input type="password" name="{{ form.password.name }}" id="{{ form.password.id_for_label }}" required
                            class="block w-full pl-10 pr-3 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-600 focus:border-indigo-600 sm:text-sm transition placeholder-slate-400"
                            placeholder="••••••••">
                    </div>
                </div>

                <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-600 transition">
                    <i class="fa-solid fa-right-to-bracket mr-2"></i> Sign In
                </button>
                <input type="hidden" name="next" value="{{ next }}">
            </form>

            <div class="mt-8 pt-6 border-t border-slate-100 text-center">
                <a href="{% url 'home' %}" class="text-sm text-indigo-600 hover:text-indigo-800 font-medium transition flex items-center justify-center">
                    <i class="fa-solid fa-arrow-left mr-2"></i> Back to Homepage
                </a>
            </div>
        </div>
    </div>

</body>
</html>
