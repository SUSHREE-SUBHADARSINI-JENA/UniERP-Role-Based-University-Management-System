<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}UniERP Dashboard{% endblock %}</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .sidebar-item.active {
            background-color: rgb(79 70 229 / 0.1); /* indigo-100 */
            color: rgb(79 70 229); /* indigo-600 */
            border-right: 4px solid rgb(79 70 229);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex">

    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r border-slate-200 flex-shrink-0 fixed h-full z-10 transition-transform">
        <div class="h-16 flex items-center px-6 border-b border-slate-200">
            <span class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-violet-500">
                <i class="fa-solid fa-graduation-cap mr-2"></i>UniERP
            </span>
        </div>

        <div class="p-4">
            <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-4 px-2">Main Menu</p>
            <nav class="space-y-1">
                <a href="{% url 'admin_dashboard' %}" class="sidebar-item hover:bg-slate-50 text-slate-600 flex items-center px-4 py-3 rounded-lg transition-colors {% if request.resolver_match.url_name == 'admin_dashboard' %}active{% endif %}">
                    <i class="fa-solid fa-chart-pie w-6"></i> Dashboard
                </a>
                <a href="{% url 'admin_teachers' %}" class="sidebar-item hover:bg-slate-50 text-slate-600 flex items-center px-4 py-3 rounded-lg transition-colors {% if request.resolver_match.url_name == 'admin_teachers' %}active{% endif %}">
                    <i class="fa-solid fa-chalkboard-user w-6"></i> Teachers
                </a>
                <a href="{% url 'admin_students' %}" class="sidebar-item hover:bg-slate-50 text-slate-600 flex items-center px-4 py-3 rounded-lg transition-colors {% if request.resolver_match.url_name == 'admin_students' %}active{% endif %}">
                    <i class="fa-solid fa-user-graduate w-6"></i> Students
                </a>
                <a href="{% url 'admin_departments' %}" class="sidebar-item hover:bg-slate-50 text-slate-600 flex items-center px-4 py-3 rounded-lg transition-colors {% if request.resolver_match.url_name == 'admin_departments' %}active{% endif %}">
                    <i class="fa-solid fa-building w-6"></i> Departments
                </a>
                <a href="{% url 'admin_courses' %}" class="sidebar-item hover:bg-slate-50 text-slate-600 flex items-center px-4 py-3 rounded-lg transition-colors {% if request.resolver_match.url_name == 'admin_courses' %}active{% endif %}">
                    <i class="fa-solid fa-book-open w-6"></i> Courses
                </a>
                <a href="{% url 'admin_defaulters' %}" class="sidebar-item hover:bg-slate-50 text-slate-600 flex items-center px-4 py-3 rounded-lg transition-colors {% if request.resolver_match.url_name == 'admin_defaulters' %}active{% endif %}">
                    <i class="fa-solid fa-triangle-exclamation w-6"></i> Defaulter List
                </a>
            </nav>
        </div>

        <div class="absolute bottom-0 w-full p-4 border-t border-slate-200 bg-white">
            <div class="flex items-center gap-3 px-2 mb-4">
                <div class="w-10 h-10 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-700 font-bold">
                    A
                </div>
                <div>
                    <p class="text-sm font-semibold">Administrator</p>
                    <p class="text-xs text-slate-500">{{ request.user.username }}</p>
                </div>
            </div>
            <form action="{% url 'logout' %}" method="post">
                {% csrf_token %}
                <button type="submit" class="w-full flex items-center justify-center gap-2 px-4 py-2 border border-slate-200 text-slate-600 hover:bg-slate-50 hover:text-red-500 rounded-lg transition-colors text-sm font-medium">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i> Logout
                </button>
            </form>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="ml-64 flex-1 flex flex-col min-h-screen">
        <!-- Top Navbar -->
        <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 sticky top-0 z-10 w-full">
            <div class="flex items-center">
                <!-- Search or breadcrumbs could go here -->
            </div>
            <div class="flex items-center gap-5">
                <button class="text-slate-400 hover:text-indigo-600 transition">
                    <i class="fa-regular fa-bell text-xl"></i>
                </button>
                <div class="h-8 w-px bg-slate-200"></div>
                <div class="text-sm text-slate-600 font-medium">
                    Admin Portal
                </div>
            </div>
        </header>

        <!-- Page Content -->
        <div class="flex-1 p-8 overflow-y-auto">
            {% if messages %}
                <div class="mb-6">
                    {% for message in messages %}
                        <div class="p-4 rounded-lg {% if message.tags == 'error' %}bg-red-50 text-red-700 border border-red-200{% elif message.tags == 'success' %}bg-green-50 text-green-700 border border-green-200{% else %}bg-blue-50 text-blue-700 border border-blue-200{% endif %} flex items-center">
                            <i class="fa-solid {% if message.tags == 'error' %}fa-circle-exclamation{% else %}fa-circle-check{% endif %} mr-3"></i>
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
            
            {% block content %}{% endblock %}
        </div>
    </main>

</body>
</html>
